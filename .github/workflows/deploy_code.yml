name: Deploy Wheel File to Raspberry Pi
run-name: Deploying Wheel File to Raspberry Pi
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Build distribution with uv
        run: |
          uv build
          echo "Build completed successfully"
          ls -lh dist/
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Extract IP from user@ip format for ssh-keyscan
          SERVER_IP=$(echo "${{ secrets.RASBERRY_PI_USER_ID_IP }}" | cut -d'@' -f2)
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
      
      - name: Deploy to Raspberry Pi
        run: |
          scp -i ~/.ssh/id_rsa dist/*.whl ${{ secrets.RASBERRY_PI_USER_ID_IP }}:~/AquaSensors/
          echo "Deployment to prod completed successfully"
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa