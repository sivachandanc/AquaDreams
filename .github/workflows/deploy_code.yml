name: Deploy Wheel File to Raspberry Pi
run-name: Deploying Wheel File to Raspberry Pi
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Build distribution with uv
        run: |
          uv build
          echo "Build completed successfully"
          ls -lh dist/
      
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Extract IP from user@ip format for ssh-keyscan
          SERVER_IP=$(echo "${{ secrets.RASBERRY_PI_USER_ID_IP }}" | cut -d'@' -f2)
          echo "Scanning SSH keys from Tailscale IP: $SERVER_IP"
          
          # Now that we're on Tailscale network, ssh-keyscan should work
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>&1 || {
            echo "ssh-keyscan failed, disabling strict host key checking..."
            echo "Host $SERVER_IP" > ~/.ssh/config
            echo "  StrictHostKeyChecking no" >> ~/.ssh/config
            echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
            chmod 600 ~/.ssh/config
          }
      
      - name: Deploy to Raspberry Pi
        run: |
          scp -i ~/.ssh/id_rsa dist/*.whl ${{ secrets.RASBERRY_PI_USER_ID_IP }}:~/AquaSensors/
          echo "Deployment to prod completed successfully"
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa