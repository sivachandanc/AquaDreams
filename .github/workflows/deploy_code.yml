name: Deploy Wheel File to Raspberry Pi
run-name: Deploying Wheel File to Raspberry Pi
on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      
      - name: Build distribution with uv
        run: |
          uv build
          echo "Build completed successfully"
          ls -lh dist/
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Disable strict host key checking for deployment
          echo "Host *" > ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile=/dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config
      
      - name: Deploy to Raspberry Pi
        run: |
          scp -i ~/.ssh/id_rsa dist/*.whl ${{ secrets.RASBERRY_PI_USER_ID_IP }}:~/AquaSensors/
          echo "Deployment to prod completed successfully"
      
      - name: Cleanup SSH key
        if: always()
        run: |
          rm -f ~/.ssh/id_rsa